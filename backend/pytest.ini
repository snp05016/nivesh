[pytest]
# Collect only tests/ so stray test_*.py scripts elsewhere are never imported (#612, #624).
testpaths = tests
markers =
    timeout: maximum runtime marker used by comprehensive backend tests.
# pytest-asyncio (requirements-dev.txt) runs only @pytest.mark.asyncio tests (TEST-13).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
