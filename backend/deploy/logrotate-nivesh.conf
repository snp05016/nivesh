# Nivesh backend log rotation (OPS-14). Replaces the macOS-only scripts/cache_cleanup.sh.
# Install on the server:  sudo cp backend/deploy/logrotate-nivesh.conf /etc/logrotate.d/nivesh
# Dry run:                sudo logrotate -d /etc/logrotate.d/nivesh
# Process logs go to journald (nivesh.service); logs/advisor_harvester.log rotates itself
# (RotatingFileHandler), so it is deliberately not listed here.
/home/saumyapatel/Desktop/nivesh/backend/token_log.jsonl
/home/saumyapatel/Desktop/nivesh/backend/logs/advisor_harvest.log
{
    su saumyapatel saumyapatel
    daily
    rotate 30
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    missingok
    notifempty
    # Writers keep the file open in append mode, so truncate in place.
    copytruncate
}
