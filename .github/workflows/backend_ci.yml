name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# TEST-16: read-only token by default; no job here needs write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Check Python minor matches .python-version
      run: |
        python -c "import sys; want = tuple(map(int, open('.python-version').read().split('.')[:2])); assert sys.version_info[:2] == want, (sys.version_info[:2], want)"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # OPS-16: exact pins from requirements.lock; requirements.txt only until the lock exists.
        if [ -f backend/requirements.lock ]; then pip install -r backend/requirements.lock; else pip install -r backend/requirements.txt; fi
        pip install -r backend/requirements-dev.txt

    - name: Lint with ruff
      # Rules live in backend/ruff.toml: syntax errors (E9), broken comparisons/asserts (F63),
      # misplaced statements (F7) and late __future__ imports (F404). Widen there.
      run: ruff check backend/

    - name: Lint workflows (actions pinned to commit SHAs)
      # TEST-16: every `uses:` must reference a full 40-hex commit SHA, never a branch or tag.
      run: |
        if grep -nE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^ #]+@' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'; then
          echo "::error::unpinned action reference (pin to a full commit SHA with the tag in a comment)"
          exit 1
        fi

    - name: Repo policy checks
      run: bash scripts/check_repo_policy.sh

    - name: Check for unreferenced backend modules
      run: python scripts/find_unreferenced_modules.py

    - name: Test with pytest
      env:
        PYTHONPATH: backend
        FIRECRAWL_API_KEY: mock
        FRED_API_KEY: mock
        HF_TOKEN: mock
      # AUTH-25: the route-auth inventory and the auth/ownership/rate-limit suites gate
      # every PR, so a new route without auth (or a broken auth invariant) fails CI.
      # FINSEC-27: so do the money/identity suites (loans, KYC, FD, subscription,
      # compliance) and the gate that every such route has a test.
      run: |
        pytest backend/tests/test_ios_endpoints.py \
          backend/tests/test_route_auth_inventory.py \
          backend/tests/test_auth_*.py \
          backend/tests/test_rate_limiter.py \
          backend/tests/test_rate_limit_isolation.py \
          backend/tests/test_write_rate_limits.py \
          backend/tests/test_job_endpoints_ownership.py \
          backend/tests/test_job_admission.py \
          backend/tests/test_entitlements_fail_closed.py \
          backend/tests/test_startup_config.py \
          backend/tests/test_earnings_alerts_auth.py \
          backend/tests/test_utility_routes_auth.py \
          backend/tests/test_legacy_notification_auth.py \
          backend/tests/test_portfolio_chart_auth.py \
          backend/tests/test_portfolio_export_isolation.py \
          backend/tests/test_admin_dashboard_security.py \
          backend/tests/test_best_effort_degradation.py \
          backend/tests/test_analyst_ratings_contract.py \
          backend/tests/test_money_identity_routes.py \
          backend/tests/test_key_fact_statement.py \
          backend/tests/test_finance_loans.py \
          backend/tests/test_kyc_consent_api.py \
          backend/tests/test_fixed_deposits_api.py \
          backend/tests/test_subscription_compliance_api.py \
          backend/tests/test_subscription_lifecycle.py \
          backend/tests/test_linked_bank_accounts.py \
          backend/tests/test_finance_tracker_summary.py \
          backend/tests/test_audit_trail.py

    - name: Validate OpenAPI schema
      env:
        PYTHONPATH: backend
        FIRECRAWL_API_KEY: mock
        FRED_API_KEY: mock
        HF_TOKEN: mock
      run: |
        python backend/scripts/validate_openapi.py

    - name: Check OpenAPI contract snapshot is current
      # ARCH-04: backend/openapi.json is the API contract with the iOS app; any
      # route or schema change must regenerate and commit it so the diff is reviewed.
      id: openapi_contract
      env:
        PYTHONPATH: backend
        FIRECRAWL_API_KEY: mock
        FRED_API_KEY: mock
        HF_TOKEN: mock
      run: |
        python backend/scripts/export_openapi.py --check

    - name: Regenerate OpenAPI snapshot for review
      if: failure() && steps.openapi_contract.outcome == 'failure'
      env:
        PYTHONPATH: backend
        FIRECRAWL_API_KEY: mock
        FRED_API_KEY: mock
        HF_TOKEN: mock
      run: |
        python backend/scripts/export_openapi.py

    - name: Upload regenerated OpenAPI snapshot
      if: failure() && steps.openapi_contract.outcome == 'failure'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: openapi-json
        path: backend/openapi.json

    - name: Check Alembic migrations
      working-directory: backend
      run: |
        alembic upgrade head
        alembic check

  migrations-postgres:
    # DB-07: build the schema from migrations alone on the production engine and
    # fail on any model drift (types, FKs and unique constraints included).
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nivesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/nivesh_test
      NIVESH_TESTING: "1"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Check Python minor matches .python-version
      run: |
        python -c "import sys; want = tuple(map(int, open('.python-version').read().split('.')[:2])); assert sys.version_info[:2] == want, (sys.version_info[:2], want)"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # OPS-16: exact pins from requirements.lock; requirements.txt only until the lock exists.
        if [ -f backend/requirements.lock ]; then pip install -r backend/requirements.lock; else pip install -r backend/requirements.txt; fi
        pip install -r backend/requirements-dev.txt

    - name: Upgrade and check migrations on Postgres
      working-directory: backend
      run: |
        alembic upgrade head
        alembic check

    - name: Migration health tests
      working-directory: backend
      run: |
        python -m pytest tests/migrations tests/test_migration_163d_downgrade.py -q --noconftest
