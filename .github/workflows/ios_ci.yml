name: iOS CI

on:
  push:
    paths:
      - 'ios/**'
      - 'scripts/find_unreferenced_swift.py'
      - 'scripts/ios_release_checks.sh'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/find_unreferenced_swift.py'
      - 'scripts/ios_release_checks.sh'
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for unreferenced Swift files
      run: python3 scripts/find_unreferenced_swift.py ios/StockApp/stockme/stockme

    - name: iOS release readiness checks
      run: bash scripts/ios_release_checks.sh

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iOS App
      run: |
        cd ios/StockApp/stockme || exit 0
        set -o pipefail
        xcodebuild -project stockme.xcodeproj -scheme stockme -destination 'platform=iOS Simulator,name=iPhone 17' build 2>&1 | tail -20
