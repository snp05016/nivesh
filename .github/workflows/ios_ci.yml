name: iOS CI

on:
  push:
    paths:
      - 'ios/**'
      # ResearchReportDecodingTests reads the contract fixtures from here.
      - 'docs/research/contract/**'
      - 'scripts/find_unreferenced_swift.py'
      - 'scripts/ios_lint_gates.sh'
      - 'scripts/ios_release_checks.sh'
      - 'scripts/ios_static_checks.sh'
      - 'scripts/lint_ios_release_config.py'
      - 'scripts/lint_ios_networking.sh'
      - '.github/workflows/ios_ci.yml'
    branches: [ "main" ]
  # No paths filter on pull_request: both checks must always report so they
  # can be required on main. build-ios skips itself (reports Success) when
  # the PR touches nothing iOS-related; see the `changes` step below.
  pull_request:
    branches: [ "main" ]

# TEST-16: read-only token by default; no job here needs write access.
permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.changes.outputs.ios }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Detect iOS-related changes
      id: changes
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      # Fails the job (closed) if the diff itself fails; grep reads all input
      # (no -q) so pipefail cannot trip on SIGPIPE. --no-renames lists both the
      # old and new path of a move, so moving a file out of ios/ still counts;
      # core.quotePath=false keeps non-ASCII paths unquoted for the ^ios/ match.
      run: |
        ios=true
        if [ "$EVENT" = "pull_request" ]; then
          files=$(git -c core.quotePath=false diff --no-renames --name-only "origin/$BASE_REF...HEAD")
          if ! printf '%s\n' "$files" | grep -E '^(ios/|docs/research/contract/|scripts/find_unreferenced_swift\.py|scripts/ios_lint_gates\.sh|scripts/ios_release_checks\.sh|scripts/ios_static_checks\.sh|scripts/lint_ios_release_config\.py|scripts/lint_ios_networking\.sh|\.github/workflows/ios_ci\.yml)' >/dev/null; then
            ios=false
          fi
        fi
        echo "ios=$ios" | tee -a "$GITHUB_OUTPUT"

    - name: iOS static checks
      run: bash scripts/ios_static_checks.sh

    - name: iOS lint gates
      run: bash scripts/ios_lint_gates.sh

    - name: iOS networking and file-size lint
      run: bash scripts/lint_ios_networking.sh

    - name: Info.plist purpose-string lint
      run: python3 scripts/lint_ios_release_config.py

  build-ios:
    needs: static-checks
    if: needs.static-checks.outputs.ios == 'true'
    # TEST-15: pinned image and Xcode (schemes' LastUpgradeVersion is 2650 = Xcode 26.5).
    runs-on: macos-26

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check for unreferenced Swift files
      run: python3 scripts/find_unreferenced_swift.py ios/StockApp/stockme/stockme

    - name: iOS release readiness checks
      run: bash scripts/ios_release_checks.sh

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '26.5'

    - name: Build iOS App
      run: |
        cd ios/StockApp/stockme || exit 1
        set -o pipefail
        xcodebuild -project stockme.xcodeproj -scheme stockme -destination 'generic/platform=iOS Simulator' build 2>&1 | tail -20

    # The stockme scheme's TestAction lists stockmeTests (unit) and skips the UI tests.
    # ML-25: the ResearchReport contract (fixture decoding, banned-copy lexicon) runs
    # as its own step so a contract break is named; the rest of stockmeTests skips it.
    - name: Research contract tests
      run: |
        cd ios/StockApp/stockme || exit 1
        set -o pipefail
        xcodebuild test -project stockme.xcodeproj -scheme stockme -destination 'platform=iOS Simulator,name=iPhone 17' -only-testing:stockmeTests/ResearchReportDecodingTests -only-testing:stockmeTests/ResearchCopyLexiconTests 2>&1 | tail -80

    - name: Unit tests
      run: |
        cd ios/StockApp/stockme || exit 1
        set -o pipefail
        xcodebuild test -project stockme.xcodeproj -scheme stockme -destination 'platform=iOS Simulator,name=iPhone 17' -only-testing:stockmeTests -skip-testing:stockmeTests/ResearchReportDecodingTests -skip-testing:stockmeTests/ResearchCopyLexiconTests 2>&1 | tail -80
