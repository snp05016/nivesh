name: Security & Secrets Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # TEST-15: a manual run scans the full git history (the action passes no
  # base/head on workflow_dispatch); push/PR runs scan only the new commits.
  workflow_dispatch:

# TEST-16: read-only token by default; no job here needs write access.
permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit==1.7.10
      - name: Run Bandit
        # Blocking on high-severity, high-confidence findings (TEST-14). The medium gate
        # needs a committed baseline, which never landed (-b on a missing file exits 2).
        # To widen: generate it with this version and exclusions, commit it, then use -ll -ii -b:
        #   bandit -r backend/ -ll -ii -x backend/tradingagents-core,backend/tests,backend/.venv,backend/venv -f json -o backend/.bandit-baseline.json
        run: bandit -r backend/ -lll -iii -x backend/tradingagents-core,backend/tests,backend/.venv,backend/venv

  pip-audit:
    # AUTH-25: blocking known-vulnerability check on the backend dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: '.python-version'
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit backend requirements
        # The lock is fully pinned, so it is audited without resolving or installing;
        # requirements.txt (ranges) is resolved in a temporary venv until the lock exists.
        run: |
          if [ -f backend/requirements.lock ]; then
            pip-audit --disable-pip --no-deps -r backend/requirements.lock
          else
            pip-audit -r backend/requirements.txt
          fi
