name: Security & Secrets Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit==1.7.10
      - name: Run Bandit
        # Blocking on high-severity, high-confidence findings (TEST-14). The medium gate
        # needs a committed baseline, which never landed (-b on a missing file exits 2).
        # To widen: generate it with this version and exclusions, commit it, then use -ll -ii -b:
        #   bandit -r backend/ -ll -ii -x backend/tradingagents-core,backend/tests,backend/.venv,backend/venv -f json -o backend/.bandit-baseline.json
        run: bandit -r backend/ -lll -iii -x backend/tradingagents-core,backend/tests,backend/.venv,backend/venv
