name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'ios/**'
      - '*.md'
      - '.github/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.SERVER_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 192.168.1.122
          username: saumyapatel
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            cd /home/saumyapatel/Desktop/nivesh
            git fetch origin
            git checkout ${{ github.event.inputs.branch || 'main' }}
            git reset --hard origin/${{ github.event.inputs.branch || 'main' }}
            cd backend
            /home/saumyapatel/Desktop/nivesh/venv/bin/pip install -r requirements.txt
            /home/saumyapatel/Desktop/nivesh/venv/bin/alembic upgrade head
            sudo fuser -k 8000/tcp || true
            sleep 2
            nohup /home/saumyapatel/Desktop/nivesh/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload > /tmp/uvicorn.log 2>&1 &
            sleep 4
            curl -s --max-time 5 http://localhost:8000/ping || echo "Health check failed"
