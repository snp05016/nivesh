name: ML Engine CI

# ML-17 / TEST-18: the ml-engine test suite (anti-lookahead, walk-forward
# protocol, model contract, import smoke) gates every change to ml-engine/.
on:
  push:
    branches: [ "main" ]
    paths:
      - "ml-engine/**"
      - ".github/workflows/ml_engine_ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ml-engine/**"
      - ".github/workflows/ml_engine_ci.yml"

# TEST-16: read-only token by default; no job here needs write access.
permissions:
  contents: read

jobs:
  ml-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        # ml-engine keeps its own Python minor (see ml-engine/Dockerfile).
        python-version-file: 'ml-engine/.python-version'
        cache: 'pip'
        cache-dependency-path: 'ml-engine/requirements*.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ml-engine/requirements-dev.txt

    - name: Lint (undefined and redefined names)
      run: ruff check ml-engine --select F821,F811

    - name: Test with pytest
      working-directory: ml-engine
      run: python -m pytest -q -p no:cacheprovider
