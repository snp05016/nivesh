name: Agent guidance sync

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-guidance-sync:
    name: Agent guidance synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Require identical agent guidance
        run: |
          cmp AGENTS.md CLAUDE.md
          cmp AGENTS.md GEMINI.md
