name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  LLM_MODE: mock
  DISABLE_LIVE_LLM: "1"
  DISABLE_PAID_APIS: "1"
  ENABLE_SCHEDULER: "false"
  FORCE_DISABLE_SCHEDULER: "1"
  DISABLE_RAG_INGESTION: "1"

jobs:
  artifacts:
    name: Generate release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate static release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          python3 - <<'PY'
          import ast, json, os, re, subprocess
          from pathlib import Path

          methods = {"get", "post", "put", "delete", "patch", "options", "head"}
          def join(prefix, path):
              prefix = (prefix or "").rstrip("/")
              path = (path or "").strip()
              if prefix and (path == prefix or path.startswith(prefix + "/")):
                  return path
              if not path.startswith("/"):
                  path = "/" + path
              return (prefix + path).replace("//", "/") or "/"
          routes = []
          for file in Path("backend").rglob("*.py"):
              if any(part in {"__pycache__", ".venv", "venv"} for part in file.parts):
                  continue
              try:
                  tree = ast.parse(file.read_text(errors="ignore"), filename=str(file))
              except SyntaxError:
                  continue
              router_prefix = ""
              for node in tree.body:
                  if isinstance(node, ast.Assign) and isinstance(node.value, ast.Call):
                      func = node.value.func
                      if isinstance(func, ast.Name) and func.id == "APIRouter":
                          for kw in node.value.keywords:
                              if kw.arg == "prefix" and isinstance(kw.value, ast.Constant) and isinstance(kw.value.value, str):
                                  router_prefix = kw.value.value
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for deco in node.decorator_list:
                      call = deco if isinstance(deco, ast.Call) else None
                      func = call.func if call else deco
                      if isinstance(func, ast.Attribute) and func.attr in methods:
                          first = call.args[0] if call and call.args else None
                          if isinstance(first, ast.Constant) and isinstance(first.value, str):
                              routes.append({"method": func.attr.upper(), "path": join(router_prefix, first.value), "file": str(file), "line": node.lineno, "handler": node.name})
          Path("release-artifacts/api-route-snapshot.json").write_text(json.dumps(routes, indent=2, sort_keys=True) + "\n")

          versions = []
          for path in sorted(Path("backend/migrations/versions").glob("*.py")):
              text = path.read_text(errors="ignore")
              rev = re.search(r"revision\\s*=\\s*['\"]([^'\"]+)['\"]", text)
              down = re.search(r"down_revision\\s*=\\s*['\"]([^'\"]+)['\"]", text)
              versions.append({"file": str(path), "revision": rev.group(1) if rev else None, "down_revision": down.group(1) if down else None})
          Path("release-artifacts/migration-report.json").write_text(json.dumps(versions, indent=2, sort_keys=True) + "\n")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changelog = [
              f"# Changelog Scaffold for {os.environ.get('GITHUB_REF_NAME', sha[:7])}",
              "",
              f"- Commit: `{sha}`",
              "- Summary:",
              "- Backend changes:",
              "- iOS changes:",
              "- ML engine changes:",
              "- Migration impact:",
              "- Deployment impact:",
              "- Rollback notes:",
              "",
          ]
          Path("release-artifacts/changelog-scaffold.md").write_text("\n".join(changelog))
          Path("release-artifacts/deployment-log-template.md").write_text(
              "# Deployment Log\n\n"
              f"- Branch/tag: `{os.environ.get('GITHUB_REF_NAME', '')}`\n"
              f"- Commit SHA: `{sha}`\n"
              "- Environment:\n"
              "- Operator:\n"
              "- Commands:\n"
              "- Health checks:\n"
              "- Rollback action:\n"
          )
          Path("release-artifacts/test-summary.md").write_text(
              "# Test Summary\n\n"
              "- Generated by release-artifacts workflow.\n"
              "- Paid API tests were not run.\n"
              "- Local backend pytest was not run by this artifact job.\n"
          )
          Path("release-artifacts/health-check-summary.md").write_text(
              "# Health Check Summary\n\n"
              "- Required free endpoints: `/ping`, `/health`, `/health/live`.\n"
              "- This artifact job does not call live backend endpoints.\n"
          )
          PY

      - name: Generate OpenAPI JSON if dependencies are already available
        continue-on-error: true
        run: |
          set -euo pipefail
          cd backend
          LLM_MODE=mock DISABLE_PAID_APIS=1 DISABLE_LIVE_LLM=1 ENABLE_SCHEDULER=false FORCE_DISABLE_SCHEDULER=1 DISABLE_RAG_INGESTION=1 \
            python3 - <<'PY' > ../release-artifacts/openapi.json
          import json
          import os
          os.environ.setdefault("DATABASE_URL", "sqlite:///./stockapp_release_openapi.db")
          os.environ.setdefault("JWT_SECRET", "release-artifact-secret")
          from main import app
          print(json.dumps(app.openapi(), indent=2, sort_keys=True))
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
