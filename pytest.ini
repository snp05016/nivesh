[pytest]
# A bare `pytest` from the repo root collects only the backend suite (#612, #624).
testpaths = backend/tests
markers =
    timeout: maximum runtime marker used by comprehensive backend tests.
# pytest-asyncio (requirements-dev.txt) runs only @pytest.mark.asyncio tests (TEST-13).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
